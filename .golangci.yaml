version: "2"
linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - depguard
    - gocheckcompilerdirectives
    - intrange
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - nosprintfhostport
    - unconvert
    - usetesting
    - wastedassign
    - whitespace
  disable:
    - errcheck
    - usestdlibvars
  exclusions:
    paths:
      - node_modules/
      - app/ui/app/dist/
    rules:
      # User-facing Portuguese copy (connector catalog, prompts for attached files).
      - path: (internal/agent/connector_catalog|app/ui/attachment_budget)\.go
        linters:
          - misspell
  settings:
    misspell:
      # Comments in the DZ23 packages are written in Portuguese; these are
      # correct Portuguese words, not English misspellings.
      ignore-rules:
        - inferir
        - persistente
        - conversas
        - componentes
        # misspell splits words at accented letters ("conversão" -> "convers").
        - convers
        - comando
        - comandos
        - progresso
        - operacional
        # Vocabulário do fluxo agendado (P0-2): dependente, condicional.
        - dependente
        # E-502 (MEDIDO): o `misspell` acusou 5 palavras portuguesas correctas a mais.
        # ***A chave é `ignore-rules`, não `ignore-words`*** — *foi escrever a chave errada que fez o
        # `golangci-lint` sair com `exit 3` (erro de config), e eu revertei a edição sem ver a mensagem.*
        # *O mecanismo já existia, com o mesmo propósito; faltava acrescentar as palavras.*
        - convincente   # acusada como "convenient"
        - dependencias  # acusada como "dependencies"
        - contactos     # acusada como "contacts"
        - Calcular      # acusada como "Calculator"
        - intencional   # acusada como "intentional"
        - condicional
        - cliente
        - clientes
        - protocolo
        - protocolos
        # Vocabulário dos agentes de atendimento (estágio 35) e das aprovações humanas: são palavras
        # portuguesas corretas que o dicionário inglês do misspell sugere trocar por um cognato.
        # O misspell segue LIGADO: ignore-rules declara IDIOMA, não esconde erro de digitação em inglês.
        - argumentos
        - autor
        - eles
        - validade
        - correspondente
        - confidencial
        - transfere
        - essencial
        - candidatas
        - processos
        - corporativo
        # Vocabulario das fatias desta missao (E-367): palavras portuguesas corretas que o dicionario INGLES
        # sugere trocar por um cognato. Entram aqui pelo MESMO criterio do bloco acima - o misspell segue ligado.
        - problemas
        - decorativo
        - presentes
        - devolvendo
        - momento
        - colateral
        - metricas
        - proposito
        - conveniente
        - automatico
        - respondendo
        - informativo
        - incidentes
        # "relacao"/"relatorio": o misspell corta na letra acentuada e sobra o radical.
        - rela
        - duplicatas
        - independente
        - profissional
        - intervalos
        - invalidas
        - definitivo
        # E-547 (MEDIDO): o `ignore-rules` casa a FORMA EXACTA, nao o radical. ⇒ `decorativo` (L80) ja' estava
        # aqui, e o linter acusou `decorativos` — *o plural e' outra palavra para o dicionario*. Mesma coisa com
        # `operacional` vs `organizacional`. ⇒ *Acrescentam-se as QUATRO formas exactas que o CI acusou.*
        # ***O `misspell` SEGUE LIGADO.*** *Isto declara idioma portugues; nao esconde erro de digitacao em ingles.*
        - decorativos   # acusada como "decorations"
        - cosmeticos    # acusada como "cosmetics"
        - organizacional # acusada como "organizational"
        - posicional    # acusada como "positional"
    depguard:
      rules:
        test-only-packages:
          files:
            - $all
            - "!$test"
            - "!**/mlx/mlxtest/*.go"
          deny:
            - pkg: github.com/ollama/ollama/internal/testutil
              desc: test helpers may only be imported by test files
            - pkg: github.com/ollama/ollama/mlx/mlxtest
              desc: test helpers may only be imported by test files
            - pkg: github.com/ollama/ollama/mlx/mlxthread/mlxthreadtest
              desc: test helpers may only be imported by test files
    govet:
      disable:
        - unusedresult
    staticcheck:
      checks:
        - all
        - -QF* # disable quick fix suggestions
        - -SA1019
        - -ST1000 # package comment format
        - -ST1003 # underscores in package names
        - -ST1005 # error strings should not be capitalized
        - -ST1012 # error var naming (ErrFoo)
        - -ST1016 # receiver name consistency
        - -ST1020 # comment on exported function format
        - -ST1021 # comment on exported type format
        - -ST1022 # comment on exported var format
        - -ST1023 # omit type from declaration
severity:
  default: error
  rules:
    - linters:
        - gofmt
        - goimports
        - intrange
      severity: info
formatters:
  enable:
    - gofmt
    - gofumpt
