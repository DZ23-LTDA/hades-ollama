version: "2"
linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - depguard
    - gocheckcompilerdirectives
    - intrange
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - nosprintfhostport
    - unconvert
    - usetesting
    - wastedassign
    - whitespace
  disable:
    - errcheck
    - usestdlibvars
  exclusions:
    paths:
      - node_modules/
      - app/ui/app/dist/
    rules:
      # User-facing Portuguese copy (connector catalog, prompts for attached files).
      - path: (internal/agent/connector_catalog|app/ui/attachment_budget)\.go
        linters:
          - misspell
  settings:
    misspell:
      # Comments in the DZ23 packages are written in Portuguese; these are
      # correct Portuguese words, not English misspellings.
      ignore-rules:
        - inferir
        - persistente
        - conversas
        - componentes
        # misspell splits words at accented letters ("conversão" -> "convers").
        - convers
    depguard:
      rules:
        test-only-packages:
          files:
            - $all
            - "!$test"
            - "!**/mlx/mlxtest/*.go"
          deny:
            - pkg: github.com/ollama/ollama/internal/testutil
              desc: test helpers may only be imported by test files
            - pkg: github.com/ollama/ollama/mlx/mlxtest
              desc: test helpers may only be imported by test files
            - pkg: github.com/ollama/ollama/mlx/mlxthread/mlxthreadtest
              desc: test helpers may only be imported by test files
    govet:
      disable:
        - unusedresult
    staticcheck:
      checks:
        - all
        - -QF* # disable quick fix suggestions
        - -SA1019
        - -ST1000 # package comment format
        - -ST1003 # underscores in package names
        - -ST1005 # error strings should not be capitalized
        - -ST1012 # error var naming (ErrFoo)
        - -ST1016 # receiver name consistency
        - -ST1020 # comment on exported function format
        - -ST1021 # comment on exported type format
        - -ST1022 # comment on exported var format
        - -ST1023 # omit type from declaration
severity:
  default: error
  rules:
    - linters:
        - gofmt
        - goimports
        - intrange
      severity: info
formatters:
  enable:
    - gofmt
    - gofumpt
