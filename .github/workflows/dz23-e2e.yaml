name: dz23-e2e

# E2E UI-first local (Playwright) do shell Classe A+, sem provider externo.
# Sobe o build via `vite preview` (webServer no playwright.config.ts) e valida
# a jornada de UI determinística offline.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "app/ui/app/**"
      - ".github/workflows/dz23-e2e.yaml"

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Web E2E (shell smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/ui/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/app/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (build + preview + test)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: app/ui/app/playwright-report
          if-no-files-found: ignore
      - name: Open issue for scheduled E2E failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Scheduled E2E failure — ${GITHUB_RUN_ID}" \
            --body "The weekly E2E smoke failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label "bug" || echo "Could not create failure issue; preserving the failed workflow status."
