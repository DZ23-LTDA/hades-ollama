name: dz23-e2e

# E2E UI-first local (Playwright) do shell Classe A+, sem provider externo.
# Sobe o build via `vite preview` (webServer no playwright.config.ts) e valida
# a jornada de UI determinística offline.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/ui/app/**"
      - ".github/workflows/dz23-e2e.yaml"

permissions:
  contents: read

jobs:
  e2e:
    name: Web E2E (shell smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/ui/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/app/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (build + preview + test)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/ui/app/playwright-report
          if-no-files-found: ignore
