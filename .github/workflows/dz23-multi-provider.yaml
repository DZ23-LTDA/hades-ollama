name: dz23-multi-provider

on:
  push:
    branches:
      - feat/dz23-multi-provider-foundation
  pull_request:
    paths:
      - 'internal/multillm/**'
      - 'app/ui/**'
      - 'server/routes.go'
      - 'server/dz23_multi_provider_test.go'
      - 'examples/dz23-providers.json'
      - '.github/workflows/dz23-multi-provider.yaml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # E-665: a forma anterior era `test -z "$(gofmt ...)"`, VERDE POR CONSTRUCAO — um arquivo que NAO PARSEIA faz
      # o gofmt escrever o erro em STDERR e sair com STDOUT VAZIO, entao a comparacao de string vazia PASSAVA.
      # *Foi essa a cegueira que deixou um `internal/agent/adaptive_router.go` com uma `}` faltando atravessar o CI.*
      - name: Verify formatting
        shell: bash
        run: |
          if ! saida="$(gofmt -l internal/multillm app/ui/responses/types.go server/dz23_multi_provider_test.go server/routes.go 2>&1)"; then
            echo "gofmt FALHOU (arquivo nao parseavel ou erro de leitura):"
            echo "$saida"
            exit 1
          fi
          if [ -n "$saida" ]; then
            echo "arquivos fora do gofmt:"
            echo "$saida"
            exit 1
          fi
          echo "gofmt OK: nenhum arquivo fora de formato e nenhum erro de parse"
      - name: Test multi-provider contracts
        shell: bash
        run: |
          go test ./internal/multillm -count=1
          go test ./server -run 'TestDZ23' -count=1
      - name: Build Ollama
        run: go build .
      - name: Test and build Desktop UI
        if: matrix.os == 'ubuntu-latest'
        working-directory: app/ui/app
        run: |
          npm ci
          npm test -- --run src/api.test.ts src/components/ModelPicker.test.ts
          npm run build
