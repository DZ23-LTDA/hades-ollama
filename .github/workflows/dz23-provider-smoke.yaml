name: dz23-provider-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Live provider API keys are scoped to a protected GitHub Environment so that
    # they are only reachable from this job. Add required reviewers and a branch
    # restriction to the "provider-smoke" environment in repo settings to gate
    # who may dispatch a live run (CI-05).
    environment: provider-smoke
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
      UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
      ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
      ALIBABA_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGINGFACE_MODEL: deepseek-ai/DeepSeek-R1:fastest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile smoke checker
        run: python3 -m py_compile scripts/dz23_provider_smoke.py
      - name: Probe configured providers
        run: python3 scripts/dz23_provider_smoke.py
      - name: Open issue for scheduled provider failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Scheduled provider smoke failure — ${GITHUB_RUN_ID}" \
            --body "The weekly provider smoke failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label "bug" || echo "Could not create failure issue; preserving the failed workflow status."
