name: release-readiness

# Gate de release "um mesmo SHA": afirma que o commit candidato tem TODOS os
# checks reais concluidos com sucesso NAQUELE SHA — evita juntar "parte verde
# na main" com provas de commits anteriores. Ver docs/RELEASE_READINESS.md.
#
# Nao re-executa a matriz pesada; ele VERIFICA que a matriz ja rodou verde no
# SHA exato. Dispare manualmente (workflow_dispatch) ou automaticamente ao criar
# uma tag vX.Y.Z(-rc.N).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA ou ref a validar (default: o proprio commit deste run)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  verify-same-sha-gates:
    name: Verify release gates on one SHA
    runs-on: ubuntu-latest
    steps:
      - name: Resolve candidate SHA
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then REF="${GITHUB_SHA}"; fi
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" -q '.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $SHA"

      - name: Assert required checks are green on the candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Conjunto REAL de provas que rodam NO commit candidato (push:main / tag)
          # e constituem a prova de release DESTE fork (camada agentic Classe A+).
          # Cada um SO conta com conclusao == success (skipped/failure/cancelled/
          # timed_out => NAO release-ready). Em sincronia com docs/RELEASE_READINESS.md.
          #
          # Por que NAO estao aqui (evita erro de categoria e "verde ausente"):
          #  - "PR gate": agregador EXCLUSIVO de pull_request; nao existe num commit
          #    de main/tag. Seu conteudo real (os 3 deep gates abaixo) ja e exigido
          #    individualmente aqui, entao nada se perde.
          #  - "test (*)", "race (*)", "go_mod_tidy": matriz UPSTREAM do Ollama,
          #    disparada so em pull_request pelo design do upstream (test.yaml le
          #    github.event.pull_request.* e quebra fora de PR). Torna-la tag-aware
          #    forkearia o CI do upstream e dificultaria puxar updates do Ollama.
          #    Roda como sinal (advisory) nos PRs; NAO fica vinculada ao SHA do RC.
          #    Limitacao divulgada honestamente em docs/RELEASE_READINESS.md.
          # NOTA: "Agentic release quality gate" pertence ao release.yaml (build de
          # release), gated separadamente; nao e check de um SHA comum -> fora daqui.
          REQUIRED=(
            "Preserve Class A+ surfaces"
            "Go agentic and server gates"
            "PostgreSQL RLS, Redis DLQ and OTLP integration"
            "Web and mobile quality"
            "Generate SBOM"
          )
          # Espera ativa: os gates podem ainda estar rodando se a tag for criada
          # logo apos o merge (push:main dispara os checks). Poll ate concluir,
          # com timeout. success e a UNICA conclusao aceita.
          deadline=$(( $(date +%s) + 1800 ))   # ate 30 min
          while :; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
              -q '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' \
              > checks.tsv || true
            echo "== check-runs no SHA ${SHA} =="
            cat checks.tsv || true
            pending=0; fail=0
            for name in "${REQUIRED[@]}"; do
              line=$(awk -F'\t' -v n="$name" '$1==n {print $2"|"$3}' checks.tsv | tail -1)
              st="${line%%|*}"; cc="${line##*|}"
              if [ -z "$line" ] || [ "$st" != "completed" ]; then
                echo "... aguardando: $name (status='${st:-ausente}')"; pending=1
              elif [ "$cc" != "success" ]; then
                echo "FAIL -> $name (conclusao='${cc:-none}'; obrigatorio exige success)"; fail=1
              else
                echo "OK   -> $name (success)"
              fi
            done
            if [ "$fail" -ne 0 ]; then
              echo "::error::Um gate obrigatorio nao concluiu com success neste SHA. Nao e release-ready."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "Todos os gates obrigatorios estao verdes no SHA ${SHA}."; break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timeout aguardando os gates obrigatorios deste SHA."
              exit 1
            fi
            sleep 20
          done
