name: dz23-windows-installer

on:
  workflow_dispatch:
  push:
    # Tags de release (RC): builda o instalador do mesmo RC_SHA (§2).
    tags:
      - 'v*'
    branches:
      - feat/dz23-multi-provider-foundation
    paths:
      - 'app/**'
      - 'cmd/**'
      - 'internal/multillm/**'
      - 'server/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/dz23-configure.ps1'
      - 'examples/dz23-providers.json'
      - '.github/workflows/dz23-windows-installer.yaml'

permissions:
  actions: read
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags necessarios para git describe (versao derivada do build)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/app/package-lock.json
      - name: Build CPU runtime, Desktop, and installer
        shell: pwsh
        # Sem VERSION hardcoded: build_windows.ps1 deriva de `git describe --tags`.
        run: ./scripts/build_windows.ps1 cpu ollama app installer
      - name: Detect SignPath signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
            SIGNPATH_PROJECT_SLUG = "${{ vars.SIGNPATH_PROJECT_SLUG }}"
            SIGNPATH_SIGNING_POLICY_SLUG = "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"
            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = "${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}"
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -eq 0) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            "artifact_suffix=signed" >> $env:GITHUB_OUTPUT
            "SignPath token detected; signing request will run." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "artifact_suffix=unsigned" >> $env:GITHUB_OUTPUT
            "SignPath configuration is incomplete; installer remains UNSIGNED." >> $env:GITHUB_STEP_SUMMARY
            Write-Host "Signing disabled: missing $($missing -join ', ')."
          }
      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hades-signpath-input-${{ github.run_id }}
          path: dist/OllamaClasseAPlusSetup.exe
          if-no-files-found: error
          retention-days: 2
      - name: Submit installer to SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-signed
      - name: Replace installer with SignPath output
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "dist/signpath-signed" -Recurse -Filter "OllamaClasseAPlusSetup.exe" | Select-Object -First 1
          if ($null -eq $signed) {
            throw "SignPath completed without returning OllamaClasseAPlusSetup.exe"
          }
          Copy-Item -Path $signed.FullName -Destination "dist/OllamaClasseAPlusSetup.exe" -Force
      - name: Report installer signing state
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          if ($env:SIGNING_ENABLED -eq "true") {
            Write-Host "INSTALLER_SIGNING=SIGNED (SignPath Foundation)"
            "### Installer signing`n`n**SIGNED** with SignPath Foundation." >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "INSTALLER_SIGNING=UNSIGNED (SignPath token not configured)"
            "### Installer signing`n`n**UNSIGNED** — SignPath token is not configured." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Compute SHA-256 checksum
        shell: pwsh
        # O checksum é calculado depois da assinatura, quando habilitada.
        run: |
          $exe = "dist/OllamaClasseAPlusSetup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $line = "$hash  OllamaClasseAPlusSetup.exe"
          Set-Content -Path "$exe.sha256" -Value $line -NoNewline -Encoding ascii
          Write-Host $line
      - name: Upload installer + checksum
        uses: actions/upload-artifact@v4
        with:
          name: OllamaClasseAPlusSetup-windows-amd64-${{ steps.signing.outputs.artifact_suffix }}
          path: |
            dist/OllamaClasseAPlusSetup.exe
            dist/OllamaClasseAPlusSetup.exe.sha256
          if-no-files-found: error
          retention-days: 30
