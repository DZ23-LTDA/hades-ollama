name: class-a-plus-integrity

concurrency:
  # PRs preempt previous attempts; each push/re-run gets an independent group
  # so long platform builds cannot cancel one another on the recovery branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # Linha de recuperacao autorizada: manter as superficies Class A+ e a
      # consistencia do classificador de CI verificadas tambem nestes pushes.
      - recovery/ollama-full-snapshot

permissions:
  contents: read

jobs:
  integrity:
    name: Preserve Class A+ surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify required product and security surfaces
        run: scripts/check-class-a-plus-integrity.sh
      - name: Verify frontend-backend contract matrix
        run: node scripts/verify-contracts.mjs
      - name: Verify CI surface classifier (fail-safe + workflow consistency)
        run: python3 scripts/classify_ci_surfaces_test.py
      - name: Verify Go formatting for protected backend surfaces
        run: |
          test -z "$(gofmt -l internal/agent internal/multillm server/agent_routes.go)"

  platform-builds:
    name: CGO-free and Windows build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Build embedded UI
        working-directory: ./app/ui/app
        run: |
          npm ci --cache "${RUNNER_TEMP}/npm-cache" --prefer-online
          npm run build
      - name: Build all packages without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Cross-build complete Windows binary and packages
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
