# Secret scan -- o gate que faltava (gap E-1164)
#
# PORQUE EXISTE
#
#   *Um secret scan que so' existe quando alguem se lembra de correr nao e' um gate: e' uma
#   auditoria.* Este workflow transforma a varredura manual (E-1164, E-1169) num gate
#   obrigatorio em cada push e pull request.
#
# COMO FUNCIONA
#
#   1. descarrega o binario OFICIAL do gitleaks, numa versao FIXA;
#   2. verifica o SHA-256 contra o `checksums.txt` da propria release -- se o binario for
#      adulterado, o passo falha ANTES de o executar;
#   3. corre `gitleaks detect --no-git` sobre a arvore de trabalho com `.gitleaks.toml`.
#
#   Nao usa action de terceiro: um action e' codigo que corre com o GITHUB_TOKEN, e a
#   supply chain de um scanner de seguranca nao devia depender de uma tag mutavel.
#
# AS 14 EXCECOES
#
#   `.gitleaks.toml` allowlista 13 fixtures sinteticas + 1 linha de prosa, cada uma pelo
#   CONTEUDO DO MATCH reportado pelo proprio scanner. Nao ha exclusao de path nem de regra.
#   O repositorio de testes prova que o gate continua vivo: uma credencial `ghp_` falsa e'
#   apanhada como `github-pat`.
#
# LIMITACAO DECLARADA
#
#   Este job cobre a ARVORE DE TRABALHO (`--no-git`). O historico completo (605+ commits)
#   exige `gitleaks detect` sem `--no-git`, que e' lento e seria um segundo gate. Fica
#   registado como trabalho seguinte, nao como feito.

name: secret-scan

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (arvore de trabalho)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.28.0 verificado por SHA-256
        shell: bash
        run: |
          set -euo pipefail
          VERSAO="8.28.0"
          SHA256_ESPERADO="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output /tmp/gitleaks.tar.gz "$URL"
          echo "${SHA256_ESPERADO}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Verificar que o gate NAO esta' cego (controlo positivo)
        shell: bash
        run: |
          set -euo pipefail
          # Uma credencial inventada TEM de ser apanhada. Se nao for, a configuracao
          # silenciou o scanner e este passo falha -- um gate que nao dispara nao e' gate.
          mkdir --parents /tmp/controle
          printf 'package main\n\nconst token = "ghp_16C7e42F292c6912E7710c838347Ae178B4a"\n' > /tmp/controle/credencial_falsa.go
          if /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner --log-level fatal /tmp/controle >/dev/null 2>&1; then
            echo "::error::O gate ficou CEGO -- uma credencial ghp_ inventada nao foi apanhada."
            exit 1
          fi
          echo "Controlo positivo OK: credencial inventada apanhada."

      - name: Secret scan da arvore de trabalho
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks detect \
            --no-git \
            --redact \
            --config .gitleaks.toml \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --verbose
          echo "Secret scan limpo: 0 findings nao allowlistados."