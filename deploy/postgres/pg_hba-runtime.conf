# Database-scope boundaries for the bundled PostgreSQL service.
# Keep only the trusted administrator broad; app identities are database-scoped.
# Local admin trust is limited to the isolated container's Unix socket; TCP
# administration always uses password-authenticated SCRAM.
local   all           postgres                                  peer
local   all           ollama_agent_admin                        trust
local   ollama_agent  ollama_agent                              scram-sha-256
local   ollama_agent  ollama_agent_migrator                     scram-sha-256
local   ollama_agent  ollama_agent_runtime                      scram-sha-256
host    all           ollama_agent_admin     0.0.0.0/0           scram-sha-256
host    all           ollama_agent_admin     ::/0                scram-sha-256
host    ollama_agent  ollama_agent           0.0.0.0/0           scram-sha-256
host    ollama_agent  ollama_agent           ::/0                scram-sha-256
host    ollama_agent  ollama_agent_migrator  0.0.0.0/0           scram-sha-256
host    ollama_agent  ollama_agent_migrator  ::/0                scram-sha-256
host    ollama_agent  ollama_agent_runtime   0.0.0.0/0           scram-sha-256
host    ollama_agent  ollama_agent_runtime   ::/0                scram-sha-256
local   all           ollama_agent_runtime                      reject
host    all           ollama_agent_runtime   0.0.0.0/0           reject
host    all           ollama_agent_runtime   ::/0                reject
local   all           ollama_agent_migrator                     reject
host    all           ollama_agent_migrator  0.0.0.0/0           reject
host    all           ollama_agent_migrator  ::/0                reject
local   all           all                                       reject
host    all           all                    0.0.0.0/0           reject
host    all           all                    ::/0                reject
